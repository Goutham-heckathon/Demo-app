apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo
      version: green

  template:
    metadata:
      labels:
        app: demo
        version: green

    spec:
      containers:
      - name: demo

        image: 417609991665.dkr.ecr.ap-south-1.amazonaws.com/demo-app:2

        ports:
        - containerPort: 80