apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-blue

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo
      version: blue

  template:
    metadata:
      labels:
        app: demo
        version: blue

    spec:
      containers:
      - name: demo

        image: 417609991665.dkr.ecr.ap-south-1.amazonaws.com/demo-app:1

        ports:
        - containerPort: 80
